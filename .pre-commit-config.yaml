repos:
  - repo: local
    hooks:
      - id: fprettify
        name: fprettify
        entry: fprettify -i 2 -w 2
        language: python
        types: [fortran]
        additional_dependencies: [fprettify]
        # fprettify does not understand fypp syntax -- it eats the space in
        # "${macro}$ - x" and drops blank lines, so .fypp/.fypph are excluded.
        # The generated .f90 lives in the build tree and is never committed.
        files: '\.f90$'
